name: check-official-updates
# Weekly discovery of new / revised official data. Produces a REVIEW report artifact only.
# It never approves, never commits data and never deploys: a person must run `update_pipeline.py approve <run_id>`.
on:
  schedule: [{ cron: "0 3 * * 1" }]
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Discover and stage candidate updates (pending review)
        run: python3 pipeline/update/update_pipeline.py check --source live
      - name: Data tests still pass on the unchanged published layer
        run: pip install pytest==8.4.2 && python3 -m pytest tests/data tests/unit -q
      - uses: actions/upload-artifact@v4
        with: { name: update-review, path: data/staging/ }
      - name: Fail loudly if discovery produced blocked rows (alert)
        run: python3 -c "import json,glob; r=json.load(open(sorted(glob.glob('data/staging/*/review_report.json'))[-1])); exit(1 if r['blocked'] else 0)"
